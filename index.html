body{margin:0;color:var(--white);font:16.5px/1.7 "Plus Jakarta Sans",system-ui,sans-serif;background:transparent}
h1,h2,h3,.logo{font-family:"Plus Jakarta Sans",system-ui,sans-serif;margin:0;line-height:1.12;color:var(--white)}
h2{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:800;letter-spacing:-.025em;margin-bottom:2.2rem;text-align:center}
h2::after{content:"";display:block;width:56px;height:4px;border-radius:4px;background:var(--green);margin:14px auto 0}
h3{font-size:1.15rem;font-weight:700}a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}.sec{padding:76px clamp(22px,5vw,64px)}.narrow{max-width:820px}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}

/* floating gray nav (like the template header) */
.nav{position:sticky;top:12px;z-index:50;width:min(1160px,calc(100% - 24px));margin:12px auto 0;border-radius:99px;background:var(--gray);color:var(--navy);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 10px 0 26px;max-width:none}
.logo{font-size:1.55rem;font-weight:800;letter-spacing:-.03em;color:var(--navy);text-decoration:none}.logo span{color:var(--navy)}
.links{display:flex;gap:28px;list-style:none;margin:0;padding:0}.links a{text-decoration:none;font-size:.92rem;font-weight:600;color:var(--navy);padding:6px 0;border-bottom:2px solid transparent}.links a:hover{border-color:var(--navy)}
.tools{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1.5px solid var(--navy);border-radius:99px;overflow:hidden;font-size:.75rem}
.lang button{border:0;background:none;color:var(--navy);padding:6px 12px;cursor:pointer;font:inherit;font-weight:700}.lang [aria-pressed=true]{background:var(--navy);color:var(--white)}
.burger{display:none;border:0;background:none;cursor:pointer;color:var(--navy)}
.btn{display:inline-flex;justify-content:center;align-items:center;border-radius:12px;padding:14px 30px;font-weight:700;font-size:.95rem;text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform .2s,background .2s,color .2s,box-shadow .2s}
.btn-green{background:var(--green);color:var(--black);box-shadow:0 10px 26px rgba(54,210,51,.3)}.btn-green:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(54,210,51,.4)}
.btn-line{border-color:var(--white);color:var(--white)}.btn-line:hover{background:var(--white);color:var(--navy)}.full{width:100%}

/* hero: blurred picture + dark glass panel */
.herobg{position:relative;overflow:hidden}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:880px;margin:56px auto 40px;padding:48px 40px 56px;
 background:rgba(10,11,13,.5);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:36px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.hero>div:first-child{display:flex;flex-direction:column;align-items:center;width:100%}
.art{order:-1;position:relative;width:220px;margin:0 auto 32px}
.art::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(54,210,51,.7)}
.art img{position:relative;display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 6px var(--white)}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-size:.85rem;font-weight:600;margin-bottom:22px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.3}}
.hello{margin:0 0 4px;font-size:1.15rem;font-weight:500;color:var(--muted)}
.fullname{font-size:clamp(2.4rem,7.2vw,4.6rem);line-height:1.05;letter-spacing:-.035em;font-weight:800;text-wrap:balance}.fullname span{display:inline}
.role{margin:18px 0 0;font:600 clamp(1.15rem,2.4vw,1.5rem)/1.3 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--gray)}
.role::after{content:"";display:block;width:64px;height:4px;border-radius:4px;background:var(--green);margin:18px auto 0}
.lead{font-size:1.08rem;max-width:560px;margin:22px auto 30px;color:var(--muted)}.row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}

/* section slabs */
main>section:not(#home){width:min(1200px,calc(100% - 24px));max-width:none;margin:20px auto;padding:0;border-radius:40px;overflow:hidden}
main>section:not(#home) .wrap.sec{max-width:none;margin:0}
main>section.sec:not(#home){padding:76px clamp(22px,5vw,64px)}
#about,#contact{background:rgba(10,11,13,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line)}
#skills{background:var(--gray);color:var(--navy)}#skills h2,#skills h3{color:var(--navy)}
#experience{background:rgba(18,13,43,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line)}
#services{background:radial-gradient(560px 380px at 100% 0%,rgba(54,210,51,.22),transparent 65%),var(--black);border:1px solid var(--line)}

/* about */
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:56px;align-items:start}#contact.two{grid-template-columns:1fr 1fr}.two p{margin:0 0 16px;color:var(--muted)}
.values,.info{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:14px}.values li,.info li{display:flex;align-items:center;gap:14px}
.values i,.info i,.values svg,.info svg{color:var(--green);flex:none}
.values li>span{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:rgba(54,210,51,.14)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:64px;background:var(--glass);border:1px solid var(--line);border-radius:28px}
.stat{padding:30px 20px;text-align:center}.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:800 2.5rem/1.1 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--green)}.stat span{font-size:.9rem;color:var(--muted)}

/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch}
.card{height:100%;background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:28px;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:rgba(54,210,51,.6)}form.card:hover{transform:none;border-color:var(--line)}
#skills .card{background:var(--white);border:0;color:var(--navy);box-shadow:0 12px 30px rgba(18,13,43,.12)}
.head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.ico{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--navy);color:var(--white);flex:none}.ico.warm{background:var(--green);color:var(--black)}
.skill{margin-bottom:16px;font-size:.92rem;font-weight:500}.skill div{display:flex;justify-content:space-between}
.track{height:8px;border-radius:9px;background:rgba(18,13,43,.12);margin-top:5px}.track i{display:block;height:100%;border-radius:9px;background:var(--navy);width:0;transition:width 1.2s ease}.warm .track i{background:var(--green)}
.serv{text-align:center;border-top:4px solid var(--green)}.serv svg{display:block;margin:0 auto;width:32px;height:32px;color:var(--green)}.serv h3{margin:16px 0 8px}.serv p{margin:0;color:var(--muted)}

/* experience */
.timeline{list-style:none;max-width:720px;margin:0 auto;padding:0 0 0 38px;border-left:2px solid var(--green)}
.timeline li{position:relative;margin-bottom:40px}.timeline li:last-child{margin-bottom:0}
.timeline .ico{position:absolute;left:-61px;top:0;border-radius:50%;width:44px;height:44px;background:var(--green);color:var(--black)}
.timeline small{color:var(--green);font-weight:700;font-size:.85rem}.timeline h3{font-size:1.3rem}.timeline p{margin:4px 0 0;color:var(--muted)}

/* contact */
label{display:block;font-weight:600;font-size:.85rem;margin:14px 0 4px}
input,textarea{width:100%;border:2px solid transparent;border-radius:14px;padding:13px 16px;font:inherit;background:var(--white);color:var(--navy)}
input:focus,textarea:focus{border-color:var(--green);outline:none}
small:empty{display:none}#form small{color:#ff8a8a;font-size:.85rem}
.ok{display:flex;gap:12px;background:rgba(54,210,51,.14);border:1px solid rgba(54,210,51,.5);border-radius:18px;padding:24px;margin:0}.ok[hidden]{display:none}.ok i,.ok svg{color:var(--green);flex:none}
#form button{margin-top:22px}.info a{text-decoration:none}
.foot{width:min(1200px,calc(100% - 24px));margin:20px auto 16px;border-radius:40px;background:var(--black);border:1px solid var(--line);text-align:center;padding:36px 20px;font-size:.9rem;color:var(--muted)}.foot svg,.foot i{color:var(--green);width:16px}.foot p{margin:6px 0 0}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}.reveal.in{opacity:1;transform:none}

@media(max-width:900px){
 .two,#contact.two,.grid3{grid-template-columns:1fr}.hero{margin:40px 16px;padding:36px 22px 44px;border-radius:28px}.art{width:180px}
 .stats{grid-template-columns:1fr}.stat+.stat{border-left:0;border-top:1px solid var(--line)}.desk{display:none}.burger{display:block}
 .nav{border-radius:32px}.bar{padding:0 8px 0 20px}
 .links{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;flex-direction:column;gap:0;background:var(--gray);padding:8px 24px 16px;border-radius:28px;box-shadow:0 16px 40px rgba(0,0,0,.4)}
 .links.open{display:flex}.links a{display:block;padding:12px 0}
 main>section:not(#home),.foot{border-radius:28px}main>section.sec:not(#home),.sec{padding:52px 20px}
}
@media(max-width:480px){.row{flex-direction:column;width:100%}.btn{width:100%}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}.dot{animation:none}.track i{transition:none}.card{transition:none}}

/* ===== Hero: text left, photo right (desktop); photo below text (mobile) ===== */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;text-align:left;max-width:1120px;padding:56px;margin:56px auto 40px}
.hero>div:first-child{align-items:flex-start;width:auto}
.fullname{font-size:clamp(2.3rem,5.2vw,4rem)}
.role::after{margin-left:0}.lead{margin:22px 0 30px}.row{justify-content:flex-start}
.art{order:0;position:relative;isolation:isolate;width:min(420px,100%);margin:0;justify-self:center}
.art::before{content:"";position:absolute;inset:auto;top:auto;left:auto;right:-8%;bottom:-8%;width:88%;aspect-ratio:1;border:0;border-radius:50%;
 background:linear-gradient(135deg,#E8A87C 0%,#4A6741 100%);filter:blur(22px);opacity:.95;z-index:-1}
.art img{position:relative;display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:40%;border:4px solid #fff;box-shadow:0 20px 40px rgba(0,0,0,.15)}
.photo-badge{position:absolute;left:-6%;bottom:10%;z-index:2;display:flex;align-items:center;gap:8px;white-space:nowrap;background:#fff;color:var(--navy);font-weight:700;font-size:.85rem;padding:10px 16px;border-radius:99px;box-shadow:0 12px 28px rgba(0,0,0,.25)}
@media(max-width:900px){
 .hero{grid-template-columns:1fr;gap:40px;text-align:center;padding:36px 22px 52px;margin:40px 16px}
 .hero>div:first-child{align-items:center}.role::after{margin:18px auto 0}.lead{margin:22px auto 30px}.row{justify-content:center}
 .art{width:min(320px,100%)}.photo-badge{left:50%;transform:translateX(-50%);bottom:-16px}
}

/* ===== Projects ===== */
#projects{background:rgba(10,11,13,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line)}
.proj-intro{max-width:640px;margin:-1rem auto 2.4rem;text-align:center;color:var(--muted)}
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1080px;margin:0 auto}
.proj{padding:0;overflow:hidden;display:flex;flex-direction:column}
.shot{background:var(--navy);border-bottom:1px solid var(--line)}
.shotbar{display:flex;align-items:center;gap:6px;padding:12px 16px;background:rgba(255,255,255,.08)}
.shotbar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35)}.shotbar i:first-child{background:var(--green)}
.shotbar span{margin-left:10px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.72rem;color:var(--muted);background:rgba(0,0,0,.35);border-radius:99px;padding:4px 12px}
.shotbody{display:grid;place-items:center;height:170px;background:radial-gradient(260px 170px at 70% 20%,rgba(54,210,51,.3),transparent 70%),linear-gradient(160deg,var(--navy),var(--black))}
.shotbody svg{width:56px;height:56px;color:var(--green);stroke-width:1.6}
.projbody{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:26px;flex:1}
.projbody p{margin:0 0 8px;color:var(--muted)}.projbody .btn{margin-top:auto;padding:12px 22px;gap:8px}.projbody .btn svg{width:18px;height:18px}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--green);background:rgba(54,210,51,.12);border-radius:99px;padding:4px 12px}
.links{gap:22px}
@media(max-width:900px){.proj-grid{grid-template-columns:1fr}}

const PROJ=[{url:"https://hopeandskillscenter.my.canva.site/rise-women-empowerment-center-website",icon:"users"},{url:"https://hopeandskillscenter.my.canva.site/",icon:"graduation-cap"},{url:"https://social-work.infinityfree.io",icon:"hand-heart"}];
const VI=["heart","lightbulb","users","hand-heart","sparkles"], GI=["heart","message-circle","laptop"],
      EI=["book-open","graduation-cap","home","baby","stethoscope","code"], SI=["users","hand-heart","globe"];
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
let lang = "en";

const io = "IntersectionObserver" in window ? new IntersectionObserver((es) => es.forEach((e) => {
  if (e.isIntersecting) { e.target.classList.add("in"); e.target.querySelectorAll(".track i").forEach((b) => b.style.width = b.dataset.w + "%"); io.unobserve(e.target); }
}), { threshold: .12 }) : null;
const watch = (el) => { el.classList.add("reveal"); io ? io.observe(el) : (el.classList.add("in"), el.querySelectorAll(".track i").forEach((b) => b.style.width = b.dataset.w + "%")); };

function render() {
  const t = T[lang];
  document.documentElement.lang = lang; document.title = t.title;
  $$("[data-i18n]").forEach((el) => el.textContent = t[el.dataset.i18n]);
  $$("[data-nav]").forEach((el) => el.textContent = t.nav[el.dataset.nav]);
  $$("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#bio").innerHTML = t.bio.map((p) => `<p>${p}</p>`).join("");
  $("#values").innerHTML = t.values.map((v, i) => `<li><span><i data-lucide="${VI[i]}"></i></span>${v}</li>`).join("");
  $("#stats").innerHTML = t.stats.map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
  $("#skillGrid").innerHTML = t.groups.map(([title, items], g) => `<div class="card ${g == 2 ? "warm" : ""}">
    <div class="head"><span class="ico ${g == 2 ? "warm" : ""}"><i data-lucide="${GI[g]}"></i></span><h3>${title}</h3></div>
    ${items.map(([s, p]) => `<div class="skill"><div><span>${s}</span><span>${p}%</span></div><div class="track" role="progressbar" aria-label="${s}" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i data-w="${p}"></i></div></div>`).join("")}</div>`).join("");
  $("#timeline").innerHTML = t.exp.map(([h, d, p], i) => `<li><span class="ico ${i == 5 ? "warm" : ""}"><i data-lucide="${EI[i]}"></i></span><small>${d}</small><h3>${h}</h3><p>${p}</p></li>`).join("");
  $("#servGrid").innerHTML = t.serv.map(([h, p], i) => `<article class="card serv ${i == 2 ? "warm" : ""}"><i data-lucide="${SI[i]}"></i><h3>${h}</h3><p>${p}</p></article>`).join("");
  $("#projGrid").innerHTML = PROJ.map((p, i) => `<article class="card proj"><div class="shot"><div class="shotbar"><i></i><i></i><i></i><span>${p.url.replace("https://","")}</span></div><div class="shotbody"><i data-lucide="${p.icon}"></i></div></div><div class="projbody"><span class="tag">Website</span><h3>${t.proj[i][0]}</h3><p>${t.proj[i][1]}</p><a class="btn btn-green" href="${p.url}" target="_blank" rel="noopener noreferrer">${t.visit} <i data-lucide="arrow-up-right"></i></a></div></article>`).join("");
  $$("#skillGrid .card,#timeline li,#servGrid .card,#projGrid .card,.stat").forEach(watch);
  window.lucide && lucide.createIcons();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-lang]");
  if (b) { lang = b.dataset.lang; render(); }
  if (e.target.closest("#links a")) { $("#links").classList.remove("open"); $("#burger").setAttribute("aria-expanded", false); }
});
$("#burger").addEventListener("click", () => { const o = $("#links").classList.toggle("open"); $("#burger").setAttribute("aria-expanded", o); });

$("#form").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = T[lang], v = { name: $("#name").value.trim(), email: $("#email").value.trim(), msg: $("#msg").value.trim() };
  const err = { name: v.name ? "" : t.errs.name, email: /^\S+@\S+\.\S+$/.test(v.email) ? "" : t.errs.email, msg: v.msg.length >= 10 ? "" : t.errs.msg };
  Object.keys(err).forEach((k) => { $("#e-" + k).textContent = err[k]; $("#" + k).setAttribute("aria-invalid", !!err[k]); });
  if (Object.values(err).every((x) => !x)) { $("#form").hidden = true; $("#ok").hidden = false; }
});

$$(".reveal,section h2").forEach(watch);
render();

</script>
</body>
</html>
